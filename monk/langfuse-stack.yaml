stack:
  defines: process-group
  metadata:
    name: Langfuse Standalone Stack
    description: Secure production-oriented self-hosted Langfuse stack with PostgreSQL, ClickHouse, Redis, MinIO, web, and worker services. Only the authenticated web application is exposed via ingress.
    tags: langfuse, llmops, observability, standalone, production
    website: https://langfuse.com/
    source: https://github.com/langfuse/langfuse
    publisher: monk.io
    private: false
  runnable-list:
    - langfuse/stack-postgres
    - langfuse/stack-redis
    - langfuse/stack-clickhouse
    - langfuse/stack-minio
    - langfuse/stack-web
    - langfuse/stack-worker

