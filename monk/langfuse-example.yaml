example:
  defines: process-group
  metadata:
    name: Langfuse Component Example
    description: Component example that inherits the reusable Langfuse base runnables and wires concrete PostgreSQL, ClickHouse, Redis, and MinIO services.
    tags: langfuse, llmops, observability, example, component
    website: https://langfuse.com/
    source: https://github.com/langfuse/langfuse
    publisher: monk.io
    private: false
  runnable-list:
    - langfuse/example-postgres
    - langfuse/example-redis
    - langfuse/example-clickhouse
    - langfuse/example-minio
    - langfuse/example-web
    - langfuse/example-worker
